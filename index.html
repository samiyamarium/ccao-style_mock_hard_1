<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAO-F Practice Exam – Block 1 (Hard Mode)</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--mu:#6b6960;--bd:#e3e0d5;--ac:#c96442;--ok:#2e7d4f;--no:#b3392f;--sel:#fbeee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--card:#2a2926;--tx:#f0eee6;--mu:#a5a297;--bd:#3d3b36;--sel:#3a2a24}}
:root[data-theme="dark"]{--bg:#1f1e1d;--card:#2a2926;--tx:#f0eee6;--mu:#a5a297;--bd:#3d3b36;--sel:#3a2a24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);z-index:5}
.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}.t.lo{color:var(--no)}
.pg{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 16px}.pg i{display:block;height:100%;background:var(--ac);border-radius:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.dm{color:var(--ac);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;margin:9px 0;font:inherit;cursor:pointer}
.o:hover{border-color:var(--ac)}.o.s{background:var(--sel);border-color:var(--ac)}
.o.ok{border-color:var(--ok);background:rgba(46,125,79,.12)}.o.no{border-color:var(--no);background:rgba(179,57,47,.12)}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
button.b.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}button.b:disabled{opacity:.4;cursor:default}
.r{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.big{font-size:56px;font-weight:800;text-align:center;margin:0}.c{text-align:center}
.star{font-size:96px;text-align:center;animation:sh 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px gold)}
@keyframes sh{0%,100%{transform:scale(1) rotate(-6deg);filter:drop-shadow(0 0 8px gold)}50%{transform:scale(1.18) rotate(6deg);filter:drop-shadow(0 0 28px gold)}}
.sp{position:fixed;font-size:22px;pointer-events:none;animation:fl 2.4s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-140px)}}
.ex{font-size:14.5px;color:var(--mu);border-top:1px dashed var(--bd);margin-top:10px;padding-top:10px}
.dr{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--bd)}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.nav span{width:30px;height:30px;border-radius:6px;border:1px solid var(--bd);display:grid;place-items:center;font-size:12px;cursor:pointer}.nav .d{background:var(--ac);color:#fff;border-color:var(--ac)}.nav .c2{outline:2px solid var(--tx)}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[
{d:"Output Evaluation",q:"An analyst pastes a six-region sales table into a normal chat and asks Claude for year-over-year growth percentages. The figures go into a board deck in one hour, and no code or calculator tool is available in this chat. What is the best way to validate them?",o:["Recompute every percentage yourself in a spreadsheet from the original table and compare it with Claude's figures.","Ask Claude to show its working line by line, and accept the results if each step reads as logical.","Ask Claude to run the calculation twice and accept the numbers if both runs agree exactly.","Ask Claude to cite the source row for every input value so each figure is traceable, then trust the arithmetic."],a:0,e:"Readable steps, agreement between runs and traceable inputs all check the story Claude tells, not the arithmetic itself. An independent recomputation is the only option that tests the numbers."},
{d:"Output Evaluation",q:"A manager asks Claude whether a 30-page vendor contract contains an auto-renewal clause. Claude answers 'No' and adds a confident two-sentence summary. The contract will be signed today. What is the most defensible next step?",o:["Ask Claude to list every section heading it checked, and sign if the list covers the whole document.","Search the contract text yourself for renewal-related wording before relying on the 'No'.","Ask a second, larger model the same question and go with the shared answer if they match.","Accept the answer, since a narrow yes/no question leaves less room for error than an open summary."],a:1,e:"A 'No' claims something is absent, and nothing in the answer lets you check that. A heading list only shows structure, not that the clause text was read, and two models can share the same miss."},
{d:"Output Evaluation",q:"Claude is given a press release and a regulatory filing about the same company. Its summary states revenue grew 12% (press release) while the filing says 9%. The summary presents 12% with no comment. Which instruction fixes the underlying behavior best?",o:["Tell Claude to always prefer the most recently dated source when figures differ.","Tell Claude to always treat the regulatory filing as authoritative when sources disagree.","Tell Claude to flag any conflict between sources and report both figures with attribution.","Remove the press release from the input so the sources cannot conflict."],a:2,e:"Preferring the filing is a sensible heuristic, but the gap may come from different definitions, such as organic versus reported growth. Surfacing the conflict lets a person decide instead of hiding it."},
{d:"Prompting & Task Execution",q:"A team wants release notes in their house style and has 40 past notes. Pasting all 40 into every prompt is slow and costly. Outputs so far drift toward generic marketing language. What is the best approach?",o:["Paste all 40 notes every time, since more examples always produce a closer style match.","Use a single best example note so there are no conflicting style signals.","Write a detailed prose description of the style and drop the examples.","Pick three notes covering different types (feature, fix, breaking change) and add a short list of style rules."],a:3,e:"A few varied examples show the style across cases without the cost of all 40. One example over-fits to a single type, and prose alone is the approach that already produced generic output."},
{d:"Prompting & Task Execution",q:"Claude's first draft of a delay-notice email to a client is too apologetic. The user says 'make it less apologetic' and the second draft comes back cold and dismissive. What is the best next message?",o:["Ask for a 'medium' level of apology between the first and second drafts.","Say what you want: one brief acknowledgment of the delay, then the new date and recovery plan in a warm, confident tone.","Paste both drafts and ask Claude to average them.","Start a new chat with the original request plus 'not too apologetic'."],a:1,e:"Relative adjustments like 'less' or 'medium' leave the target undefined, so the swing continues. Describing the desired result is a direct specification."},
{d:"Prompting & Task Execution",q:"Claude was asked to 'analyze 2,000 survey comments' and returned generic themes like 'communication' and 'pricing'. The product lead wants something usable for next quarter's planning. What improves the output most?",o:["Ask for 20 themes instead of 8 so more detail surfaces.","Ask Claude to rank the themes by frequency with exact comment counts.","Split the comments into batches of 200 and merge the batch summaries afterward.","State the decision the analysis feeds (which issues to fix next quarter) and the categories and level of detail you need."],a:3,e:"Genericness comes from a missing goal. Batching is a sound technique but does not add a purpose, and model-reported counts are not reliable without a computation step."},
{d:"Model & Feature Selection",q:"Employees ask questions daily about a 300-page policy manual that is updated each quarter. Answers must point to the relevant section, and the manual is internal. Which setup fits best?",o:["A Project holding the manual as knowledge, with instructions to cite the section and say when nothing is found.","A research mode that searches for the answers across sources.","Memory enabled, so Claude learns the manual across employees' chats.","Employees paste the relevant pages into a normal chat before each question."],a:0,e:"A Project keeps one maintained copy that applies to every chat. Research mode targets external sources, memory stores notes rather than a document library, and pasting pages by hand is inconsistent."},
{d:"Model & Feature Selection",q:"A team must pull invoice numbers from 2,000 consistently formatted PDFs monthly, with a check against purchase-order numbers. Separately, they draft a weekly vendor-risk narrative for executives. Which pairing makes sense?",o:["The most capable model for both, because invoice errors are costly and the narrative is read by executives.","A smaller, faster model for extraction with the PO check, and a more capable model for the narrative.","A smaller model for both, since the validation check will catch problems anywhere.","A more capable model for extraction and a smaller one for the internal narrative."],a:1,e:"The extraction task is simple, uniform and independently validated, so speed and cost win. The narrative needs judgment and tone for an executive audience, which justifies more capability."},
{d:"Workflow Integration",q:"An agent drafts replies to about 4,000 customer complaints a day, and roughly 5% involve possible safety incidents. Three staff are available for review. Where should humans sit in the workflow?",o:["Route messages matching safety categories to a human before any reply, and review only a sample of the rest.","A human approves every reply before it is sent, since safety is involved.","The agent sends all replies and staff review a weekly sample.","The agent asks each customer whether their complaint involves safety and routes on their answer."],a:0,e:"Reviewing everything is unworkable at this volume, weekly sampling arrives after harm, and customer self-report misses cases. Category-based routing puts scarce review where the risk is."},
{d:"Workflow Integration",q:"A team says their AI-assisted reporting process is 'saving hours,' but a manager suspects hidden rework. Which measurement best tests whether the workflow really works?",o:["A satisfaction survey of the people using the tool.","The number of drafts generated per week.","End-to-end time on a sample of reports, including review and fixes, compared with the old process, plus errors caught downstream.","Time to first draft compared with the old process."],a:2,e:"Satisfaction, volume and time to first draft measure activity or impressions. Only end-to-end time plus downstream errors captures rework."},
{d:"Configuration & Knowledge",q:"A legal team has a nine-step NDA review process. They want Claude to follow it only when reviewing NDAs, and the same team works in several separate projects. Which configuration fits best?",o:["Copy the steps into the instructions of each project.","Package the steps as a Skill that loads when an NDA review is requested.","Put the steps in memory so they carry over to all chats.","Add the steps to a single project and do NDA work only there."],a:1,e:"A Skill is a reusable, on-demand process that works across projects. Copying steps into several projects means several versions to maintain, and memory would apply the process where it should not."},
{d:"Configuration & Knowledge",q:"A sales team connects Claude to the CRM to summarize notes on their own accounts. The connector can read the whole organization's records. Which control best addresses the risk?",o:["Use a connection that respects each user's own CRM permissions, and test with a user who lacks access to an account.","Set the connector to read-only so nothing can be changed.","Add an instruction telling Claude to discuss only the user's own accounts.","Grant admin access so results are consistent for everyone."],a:0,e:"Read-only limits changes but not what can be seen, and an instruction is not an access control. Access that mirrors user permissions, tested with a restricted user, enforces the boundary."},
{d:"Governance & Responsible Use",q:"A manager wants to improve the wording of a performance-review draft in the company's approved enterprise Claude account. The draft names the employee and mentions a medical leave. Company policy allows AI for HR drafting in the approved tool. What is best?",o:["Proceed as is, because the tool is approved and covered by data terms.","Remove the medical detail and any identifiers the wording task does not need, then proceed in the approved tool.","Avoid AI for HR documents altogether.","Get the employee's consent before pasting the draft."],a:1,e:"Approval covers the tool, not every piece of data. Minimizing what the task needs is the standard diligence, and policy here already allows the use, so a ban or consent step is not required."},
{d:"Governance & Responsible Use",q:"Claude drafted ad copy saying a supplement is 'clinically proven to reduce stress.' The client has one small study. Who is accountable for the claim before it is published?",o:["The team that publishes must confirm the claim is substantiated, with legal or regulatory review where needed.","Claude, since it wrote the claim from the client's material.","Nobody, provided the ad carries an 'AI-assisted' label.","The team, once Claude rates how strong the claim is on a 1–10 scale."],a:0,e:"Publishing a claim makes the publisher answerable for it. Labels and self-rated strength do not substantiate anything, and the tool cannot bear accountability."},
{d:"Troubleshooting & Optimization",q:"A summarization prompt worked for months, but after a switch to a newer model, summaries include an unrequested 'Key risks' section. What is the best long-term fix?",o:["Roll back to the older model permanently.","Rewrite the prompt from scratch.","Add a line saying 'do not add extra sections' and move on.","State the exact required sections explicitly and re-run the evaluation set on the new model."],a:3,e:"A model change can shift default behavior, so the fix is a precise format instruction confirmed by re-running trusted test cases. Rollback is only a stopgap and a bare prohibition is untested."}
];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
Q.forEach(x=>{const c=x.o[x.a];shuf(x.o);x.a=x.o.indexOf(c)});shuf(Q);
const PASS=72,SEC=900,app=document.getElementById('app');
let ans=Array(Q.length).fill(-1),cur=0,left=SEC,tm=null,done=false,rev=false;
const L="ABCD";
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><div class="dm">Practice Exam · Block 1 of 5</div><h1 style="margin:.2em 0">CCAO-F Practice Exam</h1><p><b>Hard mode:</b> 15 fresh scenarios where every option is a sound practice, and the best answer depends on the constraint in the scenario. Questions and options are shuffled on every attempt.</p><p><b>Time:</b> 15 minutes · <b>Pass:</b> ${PASS}% (${Math.ceil(Q.length*PASS/100)} of ${Q.length}) · Feedback is shown only after you submit.</p><button class="b" onclick="go()">Start exam</button></div>`}
function go(){tm=setInterval(()=>{left--;const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.classList.toggle('lo',left<300)}if(left<=0)finish()},1000);draw()}
function draw(){const q=Q[cur];app.innerHTML=`<div class="bar"><span>Question ${cur+1}/${Q.length}</span><span class="t" id="tm">${fmt(left)}</span><button class="b" style="padding:7px 12px;font-size:14px" onclick="sub()">■ Stop &amp; get result</button></div><div class="pg"><i style="width:${(ans.filter(x=>x>=0).length/Q.length)*100}%"></i></div><div class="card"><div class="dm">${q.d}</div><p><b>Scenario:</b> ${q.q}</p>${q.o.map((t,i)=>`<button class="o ${ans[cur]===i?'s':''}" onclick="pick(${i})"><b>${L[i]})</b> ${t}</button>`).join('')}</div><div class="r"><button class="b g" onclick="mv(-1)" ${cur?'':'disabled'}>← Back</button>${cur<Q.length-1?`<button class="b" onclick="mv(1)">Next →</button>`:`<button class="b" onclick="sub()">Submit exam</button>`}</div><div class="nav">${Q.map((_,i)=>`<span class="${ans[i]>=0?'d':''} ${i===cur?'c2':''}" onclick="cur=${i};draw()">${i+1}</span>`).join('')}</div>`}
function pick(i){ans[cur]=i;draw()}function mv(n){cur+=n;draw()}
function sub(){const u=ans.filter(x=>x<0).length;if(!u||confirm(u+' question(s) unanswered. Submit anyway?'))finish()}
function finish(){if(done)return;done=true;clearInterval(tm);result()}
function result(){const ok=Q.map((q,i)=>ans[i]===q.a),n=ok.filter(Boolean).length,p=Math.round(n/Q.length*1000)/10,pass=p>=PASS;
const dom={};Q.forEach((q,i)=>{dom[q.d]=dom[q.d]||[0,0];dom[q.d][1]++;if(ok[i])dom[q.d][0]++});
app.innerHTML=`<div class="card">${pass?'<div class="star">⭐</div>':''}<h1 class="c" style="margin:.1em 0">${pass?'You passed! 🎉':'Not quite yet'}</h1><p class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${p}%</p><p class="c">${n} of ${Q.length} correct · pass mark ${PASS}% · time used ${fmt(SEC-left)}</p><p class="c">${pass?'Outstanding work, shining star! Ready for Block 2.':'Review the explanations below, then retry. Weak domains are the likeliest to sink you on a different question draw.'}</p></div><div class="card"><b>Score by domain</b>${Object.entries(dom).map(([k,v])=>`<div class="dr"><span>${k}</span><span>${v[0]}/${v[1]}</span></div>`).join('')}</div><div class="r"><button class="b" onclick="rv()">Review answers</button><button class="b g" onclick="location.reload()">Retake</button></div>`;
if(pass)for(let i=0;i<28;i++)setTimeout(()=>{const s=document.createElement('div');s.className='sp';s.textContent=['⭐','✨','🌟'][i%3];s.style.left=Math.random()*95+'vw';s.style.top=(40+Math.random()*50)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),2500)},i*90)}
function rv(){app.innerHTML=`<div class="r"><button class="b g" onclick="result()">← Results</button></div>`+Q.map((q,i)=>`<div class="card"><div class="dm">Q${i+1} · ${q.d}</div><p>${q.q}</p>${q.o.map((t,j)=>`<div class="o ${j===q.a?'ok':(j===ans[i]?'no':'')}"><b>${L[j]})</b> ${t}${j===ans[i]?' <i>(your answer)</i>':''}</div>`).join('')}<div class="ex"><b>Correct: ${L[q.a]}.</b> ${q.e}</div></div>`).join('')}
start();
</script></body></html>
