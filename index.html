<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAO-F Practice Exam – Block 1 (Hard Mode)</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--mu:#6b6960;--bd:#e3e0d5;--ac:#c96442;--ok:#2e7d4f;--no:#b3392f;--sel:#fbeee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--card:#2a2926;--tx:#f0eee6;--mu:#a5a297;--bd:#3d3b36;--sel:#3a2a24}}
:root[data-theme="dark"]{--bg:#1f1e1d;--card:#2a2926;--tx:#f0eee6;--mu:#a5a297;--bd:#3d3b36;--sel:#3a2a24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);z-index:5}
.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}.t.lo{color:var(--no)}
.pg{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 16px}.pg i{display:block;height:100%;background:var(--ac);border-radius:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.dm{color:var(--ac);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;margin:9px 0;font:inherit;cursor:pointer}
.o:hover{border-color:var(--ac)}.o.s{background:var(--sel);border-color:var(--ac)}
.o.ok{border-color:var(--ok);background:rgba(46,125,79,.12)}.o.no{border-color:var(--no);background:rgba(179,57,47,.12)}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
button.b.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}button.b:disabled{opacity:.4;cursor:default}
.r{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.big{font-size:56px;font-weight:800;text-align:center;margin:0}.c{text-align:center}
.star{font-size:96px;text-align:center;animation:sh 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px gold)}
@keyframes sh{0%,100%{transform:scale(1) rotate(-6deg);filter:drop-shadow(0 0 8px gold)}50%{transform:scale(1.18) rotate(6deg);filter:drop-shadow(0 0 28px gold)}}
.sp{position:fixed;font-size:22px;pointer-events:none;animation:fl 2.4s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-140px)}}
.ex{font-size:14.5px;color:var(--mu);border-top:1px dashed var(--bd);margin-top:10px;padding-top:10px}
.dr{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--bd)}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.nav span{width:30px;height:30px;border-radius:6px;border:1px solid var(--bd);display:grid;place-items:center;font-size:12px;cursor:pointer}.nav .d{background:var(--ac);color:#fff;border-color:var(--ac)}.nav .c2{outline:2px solid var(--tx)}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[
{d:"Output Evaluation",q:"A regional operations analyst pastes a six-region sales table (FY24 and FY25 columns, with a footnote saying two regions were reported in a different currency) into a standard chat and asks Claude for year-over-year growth. The results go into a board deck within the hour. No code execution or calculator tool is enabled in this chat, the CFO has caught small percentage errors in earlier decks, and Claude's reply shows clean percentages for all six regions with one-line explanations. Which validation approach is most defensible under these constraints?",o:["Ask Claude to reproduce each calculation with the intermediate subtraction and division shown, then read the steps for logical consistency; because every step is visible, any error should be apparent to a careful reader without needing outside tools.","Ask Claude to run the full calculation again in a fresh message and compare the two outputs; if all six percentages match exactly, the agreement across separate generations strongly suggests the arithmetic and the currency footnote were handled consistently.","Have Claude label each percentage with the exact table cells it used as inputs, and verify only that those cells were pulled correctly, since correct inputs combined with a simple growth formula make arithmetic mistakes unlikely enough to accept.","Recompute the growth figures independently in a spreadsheet from the original table, apply the footnote's currency treatment yourself, and treat Claude's numbers as a draft until the two sets agree or every difference is explained."],a:3,e:"Visible steps, matching reruns and correct inputs all test Claude's account of the calculation, not the arithmetic or the currency handling. Only an independent recomputation tests the numbers themselves."},
{d:"Output Evaluation",q:"A procurement manager uploads a 30-page vendor contract and asks whether it contains an automatic renewal clause. Claude replies 'No' with a confident two-sentence summary of the term and termination sections. The contract will be signed today, the vendor's last contract with the company did auto-renew, and the manager is short on time but can spend about ten minutes. Which next step best fits the risk?",o:["Ask Claude to list every section heading it reviewed and sign if the list covers the whole document, because a complete list shows the search was exhaustive rather than partial.","Search the contract text yourself for renewal, extension, evergreen and term-related wording, and read the surrounding clauses, before relying on a 'No' that cannot be checked from the answer alone.","Ask a second, larger model the same question and proceed if both agree, because two independent systems reaching the same conclusion greatly lowers the chance that a clause was overlooked.","Accept the answer, because a narrow yes/no question about a single clause type leaves far less room for fabrication than an open-ended summary, and Claude added supporting detail about the term section."],a:1,e:"A 'No' asserts absence, which nothing in the reply lets you verify. Headings show structure rather than that the clause text was read, and two models can share the same miss."},
{d:"Output Evaluation",q:"Claude receives a company press release and a regulatory filing and is asked for a one-paragraph financial summary. It states that revenue grew 12% (the press release figure) while the filing reports 9%, and it gives no indication the sources differ. Both documents are dated the same week. The analyst wants a change to the standing instructions that prevents silent choices like this in future analyses. Which instruction is best?",o:["Instruct Claude to prefer the most recently dated source whenever two sources give different figures, since newer information generally supersedes older statements about the same period.","Instruct Claude to treat regulatory filings as authoritative whenever they conflict with promotional material, because filings carry legal liability and press releases are written to present results favorably.","Instruct Claude to remove promotional documents from any analysis, since including sources that are designed to persuade only introduces conflicts that a summary cannot resolve cleanly.","Instruct Claude to flag any disagreement between sources, report each figure with its source, and note possible causes such as different definitions, leaving the choice of figure to the analyst."],a:3,e:"Preferring the filing is a sensible heuristic, but the gap may come from definitions such as organic versus reported growth. Surfacing the conflict lets a person decide instead of hiding it."},
{d:"Prompting & Task Execution",q:"A product team wants release notes in their house style and has 40 past notes covering features, bug fixes and breaking changes. Pasting all 40 into every request is slow and expensive, and current outputs drift toward generic marketing language ('exciting new update!'). The team lead wants consistent style without a large prompt. Which approach is best?",o:["Paste all 40 notes each time, because more examples consistently produce closer stylistic matches and the added cost is justified by the improvement in fidelity to house voice.","Choose one best example note so there are no conflicting style signals, and rely on it to anchor tone, structure and length for every type of release.","Write a detailed prose description of the house style covering tone, structure and banned phrases, and drop the examples so the prompt stays short.","Choose three notes that cover different types (feature, fix, breaking change), and add a short list of explicit style rules such as tone, length and phrases to avoid."],a:3,e:"A few varied examples show the style across cases without the cost of all 40. One example over-fits to a single type, and prose alone is what already produced generic output."},
{d:"Prompting & Task Execution",q:"Claude drafted a delay-notice email to a client that felt too apologetic. The user replied 'make it less apologetic' and the second draft came back cold and dismissive, which the user also dislikes. The client relationship is important, the new delivery date is firm, and a recovery plan exists. What is the best next message?",o:["Ask for a 'medium' level of apology, positioned between the first and second drafts, so the tone lands in the middle of what was already produced.","Start a new chat with the original request plus 'not too apologetic' so the earlier drafts do not anchor the model's tone in either direction.","Describe the result you want: one brief acknowledgment of the delay, then the firm new date and the recovery plan, in a warm and confident tone.","Paste both drafts and ask Claude to combine them by averaging their tone, since the strengths of each can offset the weaknesses of the other."],a:2,e:"Relative adjustments such as 'less' or 'medium' leave the target undefined, so the swing continues. Describing the intended result is a direct specification."},
{d:"Prompting & Task Execution",q:"A product lead asked Claude to 'analyze 2,000 survey comments' and received generic themes such as 'communication' and 'pricing.' The lead will use the analysis to choose which issues the team fixes next quarter, and has time for one more round. She is considering several changes to the request. Which change most improves usefulness?",o:["Ask for 20 themes instead of 8, so that more specific and less obvious topics appear in the output.","Ask Claude to rank themes by how often they occur and include exact comment counts for each, so priorities are based on frequency.","State the decision the analysis will feed (which issues to fix next quarter) along with the categories and level of detail needed, then check a sample of comments against the result.","Split the comments into batches of 200, summarize each batch separately, and merge the batch summaries, so no single request is overloaded."],a:2,e:"Generic output comes from a missing goal. Batching is sound but adds no purpose, and model-reported counts are unreliable without a computation step."},
{d:"Model & Feature Selection",q:"Employees ask daily questions about a 300-page internal policy manual that is revised every quarter. Managers want answers that point to the relevant section, and they do not want employees to have to find or paste text themselves. The manual is confidential and not on the public web. Which setup best fits?",o:["Enable memory so Claude gradually learns the manual from employees' questions and remembers it for everyone across conversations without files being uploaded.","Use a research mode so Claude searches for answers across multiple sources and produces cited reports for each policy question.","Have employees paste the relevant pages into a normal chat before each question, so the exact text in front of Claude is always the current version.","Create a Project holding the manual as knowledge, with instructions to cite the section and to say when nothing relevant is found, and replace the file each quarter."],a:3,e:"A Project keeps one maintained copy available to every chat. Memory stores notes rather than a document library, research targets external sources, and pasting pages by hand is inconsistent."},
{d:"Model & Feature Selection",q:"A finance team must pull invoice numbers from about 2,000 consistently formatted PDFs each month, with an automatic check of each number against purchase-order records. Separately, the same team drafts a weekly narrative on vendor risk that executives read. Budget matters, but errors in the executive narrative would be visible to leadership. Which model pairing is most sensible?",o:["Use the most capable model for both tasks, because invoice errors are costly and the narrative is read by executives, so quality should not be traded for cost anywhere.","Use a smaller, faster model for extraction with the purchase-order check, and a more capable model for the executive narrative.","Use a smaller model for both tasks, because the validation check will catch problems anywhere in the workflow, including weak narrative writing.","Use a more capable model for extraction, since accuracy on numbers is critical, and a smaller model for the narrative because it is read internally."],a:1,e:"Extraction here is simple, uniform and independently validated, so speed and cost win. The narrative needs judgment and tone for an executive audience, which justifies more capability."},
{d:"Workflow Integration",q:"An agent drafts replies to about 4,000 customer complaints a day, and roughly 5% involve possible safety incidents such as injuries or product defects. Only three staff members are available for review. The company wants speed for routine complaints but cannot risk unreviewed replies to safety cases. Where should humans sit in the workflow?",o:["Route messages that match safety categories to a human before any reply is sent, and review only a sample of the remaining replies.","Have a human approve every reply before sending, because safety is involved and the cost of one missed case outweighs any efficiency gain.","Let the agent send all replies and have staff review a weekly sample, since sampling across many replies will reveal any systematic safety errors.","Have the agent ask each customer whether their complaint involves safety and route on their answer, since customers know best what happened."],a:0,e:"Reviewing everything is unworkable at this volume, weekly sampling arrives after harm, and customer self-report misses cases. Category-based routing places scarce review where the risk is."},
{d:"Workflow Integration",q:"A reporting team says their AI-assisted process is 'saving hours.' A skeptical manager suspects the time is being spent later on corrections and rework that nobody tracks. The team has data on drafts generated, user survey responses, time to first draft, and total hours logged per report. Which measurement best tests whether the workflow truly works?",o:["A satisfaction survey of the people using the tool, because their direct experience is the most reliable indicator of whether the process is helping.","The number of drafts generated per week, because rising output volume shows that the workflow is being adopted and is producing more work.","Time to first draft compared with the old process, because it isolates the step the AI actually changes without noise from later stages.","End-to-end time for a sample of reports, including review and fixes, compared with the old process, plus errors found downstream."],a:3,e:"Satisfaction, volume and time to first draft measure impressions or activity. Only end-to-end time plus downstream errors captures hidden rework."},
{d:"Configuration & Knowledge",q:"A legal team has a nine-step process for reviewing NDAs. They want Claude to follow it only when an NDA is being reviewed, and lawyers on the team work in several different projects and ordinary chats. Consistency across lawyers matters, and the process changes once or twice a year. Which configuration fits best?",o:["Copy the nine steps into the instructions of every project the lawyers use, so the process is always present wherever they happen to work.","Put the steps into memory so they carry across all chats, since memory follows the user everywhere without needing per-project configuration.","Package the steps as a Skill that loads when an NDA review is requested, and update the single Skill when the process changes.","Add the steps to one project and ask lawyers to do all NDA work only in that project, so instructions are applied consistently."],a:2,e:"A Skill is a reusable, on-demand process that works across projects. Copies in several projects create several versions to maintain, and memory would apply the process where it should not."},
{d:"Configuration & Knowledge",q:"A sales team connects Claude to the company CRM so reps can summarize notes on the accounts they own. The connector's service account can read the entire organization's records, including accounts owned by other teams with confidential deal terms. The team wants the setup to be safe without losing usefulness. Which control best addresses the risk?",o:["Set the connector to read-only so that nothing in the CRM can be changed, which removes the main risk of the connector.","Use a connection that respects each user's own CRM permissions, and test with a user who lacks access to a particular account.","Add an instruction telling Claude to discuss only the accounts belonging to the user asking, so that other teams' records are never mentioned.","Grant admin access so results are consistent for every rep, and rely on the reps' good judgment not to ask about other accounts."],a:1,e:"Read-only limits changes but not what can be seen, and an instruction is not an access control. Access that mirrors user permissions, tested with a restricted user, enforces the boundary."},
{d:"Governance & Responsible Use",q:"A manager wants to improve the wording of a performance-review draft using the company's approved enterprise Claude account. The draft names the employee and mentions a period of medical leave. Company policy explicitly allows AI drafting for HR documents in the approved tool, and the account has data terms that prohibit training on inputs. What is the best approach?",o:["Proceed as is, because the tool is approved and contractually protected, so any content allowed in HR documents can be pasted into it.","Avoid AI for HR documents altogether, since performance reviews affect careers and any use of a model introduces risk that outweighs wording help.","Obtain the employee's written consent before pasting the draft, since medical information is involved and consent is the safest basis for any processing.","Remove the medical detail and any identifiers the wording task does not need, then proceed in the approved tool."],a:3,e:"Approval covers the tool, not every piece of data. Minimizing to what the task needs is standard diligence, and since policy already allows the use, a ban or consent step is not required."},
{d:"Governance & Responsible Use",q:"Claude drafted advertising copy stating that a supplement is 'clinically proven to reduce stress.' The client has one small study with 24 participants and no control group. The campaign launches Friday, and the marketing lead says Claude wrote the claim from the client's own materials. Who is accountable for the claim before publication?",o:["Claude, because it produced the claim and should have flagged that the underlying evidence was weak before presenting it as ready copy.","The publishing team, which must confirm the claim is substantiated and involve legal or regulatory review where needed before publication.","Nobody in particular, provided the ad carries an 'AI-assisted content' label, since disclosure of AI involvement addresses the responsibility question.","The publishing team, once Claude rates the strength of the claim on a 1–10 scale and the rating exceeds an agreed threshold."],a:1,e:"Publishing a claim makes the publisher answerable for it. Labels and self-rated strength do not substantiate anything, and a tool cannot bear accountability."},
{d:"Troubleshooting & Optimization",q:"A summarization prompt worked reliably for months. After the team switched to a newer model, summaries now include an unrequested 'Key risks' section. Downstream tooling expects exactly three sections, and the team has a set of 50 trusted test documents with approved summaries. What is the best long-term fix?",o:["Roll back to the older model permanently, since it produced the correct format for months and the newer model has shown that it changes behavior.","Rewrite the prompt from scratch with a different structure, since a prompt that fails after a model change is likely poorly designed.","Add one line saying 'do not add extra sections' and move on, since a clear prohibition is enough to remove the unwanted behavior.","State the exact required sections explicitly in the prompt, then re-run the 50 test documents on the new model to confirm the format and quality hold."],a:3,e:"A model change can shift default behavior, so the fix is a precise format instruction confirmed by re-running trusted cases. Rollback is only a stopgap, and a bare prohibition is untested."}
];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
Q.forEach(x=>{const c=x.o[x.a];shuf(x.o);x.a=x.o.indexOf(c)});shuf(Q);
const PASS=72,SEC=2400,app=document.getElementById('app');
let ans=Array(Q.length).fill(-1),cur=0,left=SEC,tm=null,done=false,rev=false;
const L="ABCD";
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><div class="dm">Practice Exam · Block 1 of 5</div><h1 style="margin:.2em 0">CCAO-F Practice Exam</h1><p><b>Hard mode:</b> 15 long-form scenarios with red herrings, and options that each sound defensible. Read closely: the best answer depends on the specific constraints given. Questions and options shuffle on every attempt.</p><p><b>Time:</b> 40 minutes · <b>Pass:</b> ${PASS}% (${Math.ceil(Q.length*PASS/100)} of ${Q.length}) · Feedback is shown only after you submit.</p><button class="b" onclick="go()">Start exam</button></div>`}
function go(){tm=setInterval(()=>{left--;const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.classList.toggle('lo',left<300)}if(left<=0)finish()},1000);draw()}
function draw(){const q=Q[cur];app.innerHTML=`<div class="bar"><span>Question ${cur+1}/${Q.length}</span><span class="t" id="tm">${fmt(left)}</span><button class="b" style="padding:7px 12px;font-size:14px" onclick="sub()">■ Stop &amp; get result</button></div><div class="pg"><i style="width:${(ans.filter(x=>x>=0).length/Q.length)*100}%"></i></div><div class="card"><div class="dm">${q.d}</div><p><b>Scenario:</b> ${q.q}</p>${q.o.map((t,i)=>`<button class="o ${ans[cur]===i?'s':''}" onclick="pick(${i})"><b>${L[i]})</b> ${t}</button>`).join('')}</div><div class="r"><button class="b g" onclick="mv(-1)" ${cur?'':'disabled'}>← Back</button>${cur<Q.length-1?`<button class="b" onclick="mv(1)">Next →</button>`:`<button class="b" onclick="sub()">Submit exam</button>`}</div><div class="nav">${Q.map((_,i)=>`<span class="${ans[i]>=0?'d':''} ${i===cur?'c2':''}" onclick="cur=${i};draw()">${i+1}</span>`).join('')}</div>`}
function pick(i){ans[cur]=i;draw()}function mv(n){cur+=n;draw()}
function sub(){const u=ans.filter(x=>x<0).length;if(!u||confirm(u+' question(s) unanswered. Submit anyway?'))finish()}
function finish(){if(done)return;done=true;clearInterval(tm);result()}
function result(){const ok=Q.map((q,i)=>ans[i]===q.a),n=ok.filter(Boolean).length,p=Math.round(n/Q.length*1000)/10,pass=p>=PASS;
const dom={};Q.forEach((q,i)=>{dom[q.d]=dom[q.d]||[0,0];dom[q.d][1]++;if(ok[i])dom[q.d][0]++});
app.innerHTML=`<div class="card">${pass?'<div class="star">⭐</div>':''}<h1 class="c" style="margin:.1em 0">${pass?'You passed! 🎉':'Not quite yet'}</h1><p class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${p}%</p><p class="c">${n} of ${Q.length} correct · pass mark ${PASS}% · time used ${fmt(SEC-left)}</p><p class="c">${pass?'Outstanding work, shining star! Ready for Block 2.':'Review the explanations below, then retry. Weak domains are the likeliest to sink you on a different question draw.'}</p></div><div class="card"><b>Score by domain</b>${Object.entries(dom).map(([k,v])=>`<div class="dr"><span>${k}</span><span>${v[0]}/${v[1]}</span></div>`).join('')}</div><div class="r"><button class="b" onclick="rv()">Review answers</button><button class="b g" onclick="location.reload()">Retake</button></div>`;
if(pass)for(let i=0;i<28;i++)setTimeout(()=>{const s=document.createElement('div');s.className='sp';s.textContent=['⭐','✨','🌟'][i%3];s.style.left=Math.random()*95+'vw';s.style.top=(40+Math.random()*50)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),2500)},i*90)}
function rv(){app.innerHTML=`<div class="r"><button class="b g" onclick="result()">← Results</button></div>`+Q.map((q,i)=>`<div class="card"><div class="dm">Q${i+1} · ${q.d}</div><p>${q.q}</p>${q.o.map((t,j)=>`<div class="o ${j===q.a?'ok':(j===ans[i]?'no':'')}"><b>${L[j]})</b> ${t}${j===ans[i]?' <i>(your answer)</i>':''}</div>`).join('')}<div class="ex"><b>Correct: ${L[q.a]}.</b> ${q.e}</div></div>`).join('')}
start();
</script></body></html>
